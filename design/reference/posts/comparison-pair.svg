<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <title>référence reconstruite, pas un rendu produit</title>
  <desc>paire de comparaison, deux bulles qui se font face, deux teintes — reconstruite depuis la spécification écrite du système validé, sans passer par lib/compose.</desc>
  <rect width="1080" height="1350" fill="#FAF6EE"/>
  <text x="72" y="118" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="24" font-weight="500" fill="#2B2A27">TWO READINGS</text>
  <text x="72" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="400" fill="#2B2A27">What it looks like,</text>
  <text x="72" y="368.48" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="400" fill="#2B2A27">what it feels like</text>
  <path d="M 159 456.96000000000004 L 429 456.96000000000004 A 40 40 0 0 1 469 496.96000000000004 L 469 600.96 A 40 40 0 0 1 429 640.96 L 159 640.96 A 40 40 0 0 1 119 600.96 L 119 496.96000000000004 A 40 40 0 0 1 159 456.96000000000004 Z" fill="none" stroke="#2B2A27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 406 640.96 L 430.5 670.4000000000001 L 462 640.96" fill="none" stroke="#2B2A27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 651 456.96000000000004 L 921 456.96000000000004 A 40 40 0 0 1 961 496.96000000000004 L 961 600.96 A 40 40 0 0 1 921 640.96 L 651 640.96 A 40 40 0 0 1 611 600.96 L 611 496.96000000000004 A 40 40 0 0 1 651 456.96000000000004 Z" fill="none" stroke="#2B2A27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 674 640.96 L 649.5 670.4000000000001 L 618 640.96" fill="none" stroke="#2B2A27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="72" y="717.96" width="444" height="201.01999999999998" rx="18" fill="#F0E7D8"/>
    <text x="104" y="789.96" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#2B2A27">Looks fine</text>
    <text x="104" y="837.96" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#2B2A27">shows up on time</text>
  <rect x="72" y="966.98" width="444" height="201.01999999999998" rx="18" fill="#F0E7D8"/>
    <text x="104" y="1038.98" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#2B2A27">Sounds steady</text>
    <text x="104" y="1086.98" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#2B2A27">answers every message</text>
  <rect x="564" y="717.96" width="444" height="201.01999999999998" rx="18" fill="#E7D3AE"/>
    <text x="596" y="789.96" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#2B2A27">Feels braced</text>
    <text x="596" y="837.96" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#2B2A27">shoulders never drop</text>
  <rect x="564" y="966.98" width="444" height="201.01999999999998" rx="18" fill="#E7D3AE"/>
    <text x="596" y="1038.98" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#2B2A27">Sleeps light</text>
    <text x="596" y="1086.98" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#2B2A27">awake before the alarm</text>
  <text x="72" y="1272" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="26" font-weight="400" fill="#6E675C">@rowanmercier</text>
</svg>
