<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <title>référence reconstruite, pas un rendu produit</title>
  <desc>anneaux de contrôle, une silhouette assise au centre, trois teintes — reconstruite depuis la spécification écrite du système validé, sans passer par lib/compose.</desc>
  <rect width="1080" height="1350" fill="#FAF6EE"/>
  <text x="72" y="118" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="24" font-weight="500" fill="#2B2A27">CONTROL</text>
  <text x="72" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="400" fill="#2B2A27">What is yours</text>
  <text x="72" y="368.48" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="400" fill="#2B2A27">to put down</text>
