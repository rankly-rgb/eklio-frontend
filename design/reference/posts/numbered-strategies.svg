<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <title>référence reconstruite, pas un rendu produit</title>
  <desc>stratégies numérotées, une plante en pot, trois teintes — reconstruite depuis la spécification écrite du système validé, sans passer par lib/compose.</desc>
  <rect width="1080" height="1350" fill="#FAF6EE"/>
  <text x="72" y="118" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="24" font-weight="500" fill="#2B2A27">THREE RETURNS</text>
  <text x="72" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="400" fill="#2B2A27">Three small things</text>
  <text x="72" y="368.48" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="400" fill="#2B2A27">that give a little back</text>
  <path d="M 147 645 L 176 765 L 282 765 L 311 645 Z" fill="none" stroke="#2B2A27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 229 645 C 216 595 238 545 229 488" fill="none" stroke="#2B2A27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 229 598 C 147 595 113 532 198 520 C 223 545 232 573 229 598 Z" fill="none" stroke="#2B2A27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 229 570 C 311 564 345 501 260 488 C 235 513 226 545 229 570 Z" fill="none" stroke="#2B2A27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 434 458.96000000000004 L 434 1166" fill="none" stroke="#2B2A27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 420 559 L 448 559" fill="none" stroke="#2B2A27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 420 812 L 448 812" fill="none" stroke="#2B2A27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 420 1065 L 448 1065" fill="none" stroke="#2B2A27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="494" y="456.96000000000004" width="514" height="205.01333333333332" rx="18" fill="#F0E7D8"/>
    <text x="526" y="528.96" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#2B2A27">Name it</text>
    <text x="526" y="576.96" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#2B2A27">say what today cost</text>
  <rect x="494" y="709.9733333333334" width="514" height="205.01333333333332" rx="18" fill="#E7D3AE"/>
    <text x="526" y="781.9733333333334" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#2B2A27">Slow down</text>
    <text x="526" y="829.9733333333334" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#2B2A27">one thing at a time</text>
  <rect x="494" y="962.9866666666667" width="514" height="205.01333333333332" rx="18" fill="#EBC8B8"/>
    <text x="526" y="1034.9866666666667" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#2B2A27">Stop early</text>
    <text x="526" y="1082.9866666666667" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#2B2A27">before the tank empties</text>
  <text x="72" y="1272" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="26" font-weight="400" fill="#6E675C">@rowanmercier</text>
