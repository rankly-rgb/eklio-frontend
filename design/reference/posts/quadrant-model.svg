<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <title>référence reconstruite, pas un rendu produit</title>
  <desc>modèle en quatre cases, un profil de tête au centre, quatre teintes — reconstruite depuis la spécification écrite du système validé, sans passer par lib/compose.</desc>
  <rect width="1080" height="1350" fill="#FAF6EE"/>
  <text x="72" y="118" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="24" font-weight="500" fill="#2B2A27">BURNOUT</text>
  <text x="72" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="400" fill="#2B2A27">Effort on one axis,</text>
  <text x="72" y="368.48" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="400" fill="#2B2A27">relief on the other</text>
  <path d="M 475 687 C 453 622 457 530 518 500 C 566 482 610 513 603 552 L 588 571 L 610 602 L 584 611 C 594 622 579 628 588 637 C 597 654 570 663 553 663 C 540 672 538 678 538 687" fill="none" stroke="#2B2A27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="685" y="577.96" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="24" font-weight="500" fill="#2B2A27">effort</text>
  <text x="72" y="482.96000000000004" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="24" font-weight="500" fill="#2B2A27">relief</text>
  <rect x="72" y="746.96" width="444" height="186.51999999999998" rx="18" fill="#F0E7D8"/>
    <text x="104" y="818.96" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#2B2A27">Sunday dread</text>
    <text x="104" y="866.96" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#2B2A27">starts before the alarm</text>
  <rect x="564" y="746.96" width="444" height="186.51999999999998" rx="18" fill="#E7D3AE"/>
    <text x="596" y="818.96" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#2B2A27">Rest fails</text>
    <text x="596" y="866.96" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#2B2A27">the body stays braced</text>
  <rect x="72" y="981.48" width="444" height="186.51999999999998" rx="18" fill="#EBC8B8"/>
    <text x="104" y="1053.48" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#2B2A27">Still bracing</text>
    <text x="104" y="1101.48" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#2B2A27">nothing asked it to</text>
  <rect x="564" y="981.48" width="444" height="186.51999999999998" rx="18" fill="#DCE0D3"/>
    <text x="596" y="1053.48" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#2B2A27">Sleep breaks</text>
    <text x="596" y="1101.48" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#2B2A27">waking at four</text>
  <text x="72" y="1272" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="26" font-weight="400" fill="#6E675C">@rowanmercier</text>
</svg>
